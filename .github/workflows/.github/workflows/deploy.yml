name: 🚀 Deploy ReLife Cameroun

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Install Firebase Tools
        run: npm install -g firebase-tools

      - name: 🔐 Inject Firebase Config
        run: |
          sed -i "s|___FIREBASE_API_KEY___|${{ secrets.FIREBASE_API_KEY }}|g" index.html
          sed -i "s|___FIREBASE_AUTH_DOMAIN___|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" index.html
          sed -i "s|___FIREBASE_PROJECT_ID___|${{ secrets.FIREBASE_PROJECT_ID }}|g" index.html
          sed -i "s|___FIREBASE_STORAGE_BUCKET___|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" index.html
          sed -i "s|___FIREBASE_MESSAGING_SENDER_ID___|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" index.html
          sed -i "s|___FIREBASE_APP_ID___|${{ secrets.FIREBASE_APP_ID }}|g" index.html

      - name: ✅ Verify config injection
        run: |
          if grep -q "___FIREBASE" index.html; then
            echo "❌ ERROR: Some placeholders were not replaced!"
            exit 1
          else
            echo "✅ All placeholders replaced successfully!"
          fi

      - name: 🚀 Deploy to Firebase Hosting
        run: firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}

      - name: ✅ Deployment complete
        run: echo "🎉 Deployment completed successfully!"

        Add GitHub Actions workflow
